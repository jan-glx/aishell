# Insert within the existing MCP domain TLS server block.
# Route only the new viewer paths to the MCP OAuth service.
location = /command-log {
    proxy_pass http://127.0.0.1:8766;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 8k;
}
location ^~ /command-log/ {
    proxy_pass http://127.0.0.1:8766;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 8k;
}
