# Insert `include /etc/nginx/snippets/aishell-mcp-routes.conf;`
# into the HTTPS server block matching the intended DOMAIN.
# This snippet intentionally contains no public catch-all location.

# OAuth authorization, token, registration and revocation paths
location ~ ^/(authorize|token|register|revoke)$ {
    proxy_pass http://127.0.0.1:8766;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 40s;
    client_max_body_size 64k;
}

location = /oauth/consent {
    proxy_pass http://127.0.0.1:8766/oauth/consent;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 16k;
}

# RFC 8414, RFC 9728 and OpenAI's observed discovery fallback
location = /.well-known/openid-configuration {
    proxy_pass http://127.0.0.1:8766/.well-known/openid-configuration;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}
location = /.well-known/oauth-authorization-server {
    proxy_pass http://127.0.0.1:8766/.well-known/oauth-authorization-server;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}
location = /.well-known/oauth-protected-resource {
    proxy_pass http://127.0.0.1:8766/.well-known/oauth-protected-resource;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}
location = /.well-known/oauth-protected-resource/mcp {
    proxy_pass http://127.0.0.1:8766/.well-known/oauth-protected-resource/mcp;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Stateless MCP endpoint, including 2026-07-28 server/discover
location = /mcp {
    proxy_pass http://127.0.0.1:8766/mcp;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 60s;
    client_max_body_size 64k;
}
