# Optional route for signed download URLs returned by v2 getFile.
# Install only after verifying the v2 executor's download listener.
# Insert in the existing nginx HTTPS server block for your MCP domain.
# Do not replace its other application locations.
location /mcp-v2/download/ {
    proxy_pass http://127.0.0.1:8780/mcp-v2/download/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_hide_header Server;
    proxy_read_timeout 60s;
    proxy_buffering off;
}
